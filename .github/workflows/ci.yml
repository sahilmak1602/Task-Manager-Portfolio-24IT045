
name: Task Manager API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task-manager-api-24IT045

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-manager-api-24IT045/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test
